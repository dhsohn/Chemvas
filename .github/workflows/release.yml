name: Release

# Publishes to PyPI via Trusted Publishing (OIDC) when a v* tag is pushed.
# No API token is stored: the pypi environment mints a short-lived token from
# GitHub's OIDC identity. See RELEASING.md for the one-time PyPI setup.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate release provenance
        env:
          CHEMVAS_RELEASE_COMMIT: ${{ github.sha }}
          CHEMVAS_RELEASE_REPOSITORY: ${{ github.repository }}
          CHEMVAS_RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python scripts/verify_release.py \
            --tag "$CHEMVAS_RELEASE_TAG" \
            --commit "$CHEMVAS_RELEASE_COMMIT" \
            --repository "$CHEMVAS_RELEASE_REPOSITORY"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
          python scripts/verify_dist.py dist/*

      - name: Check package metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chemvas
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
