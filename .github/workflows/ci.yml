name: CI

on:
  # Pull requests run through pull_request; a push runs only on main, so a PR
  # commit is checked once.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy

  package-smoke:
    name: Wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
          python scripts/verify_dist.py dist/*

      - name: Install wheel without source-tree imports
        run: |
          python -m venv /tmp/chemvas-wheel-smoke
          /tmp/chemvas-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/chemvas-wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import distribution
          from importlib.util import find_spec
          import subprocess
          import sys

          import chemvas
          import chemvas.ui
          from chemvas.bootstrap.application import main
          from chemvas.domain.document import MoleculeModel

          installed = distribution("chemvas")
          installed_files = {str(path) for path in installed.files or ()}
          console_scripts = {
              entry_point.name: entry_point.value
              for entry_point in installed.entry_points
              if entry_point.group == "console_scripts"
          }

          assert chemvas.__version__
          assert callable(main)
          assert MoleculeModel is not None
          assert "chemvas/adapters/qt/file_open_events.py" in installed_files
          assert console_scripts["chemvas"] == "chemvas.bootstrap.application:main"
          assert find_spec("core") is None
          assert find_spec("ui") is None
          assert find_spec("chemvas.bootstrap.web_adapter") is None
          assert find_spec("chemvas.bootstrap.web_drafts") is None
          assert not any(path.startswith("chemvas/web/") for path in installed_files)
          for args, expected in [
              (["--version"], 0),
              (["--help"], 0),
              (["--ui", "qt", "--help"], 0),
              (["--ui", "web"], 2),
              (["--ui", "web", "--no-browser"], 2),
          ]:
              result = subprocess.run(
                  [sys.executable, "-I", "-m", "chemvas", *args],
                  capture_output=True, text=True, timeout=15,
              )
              output = result.stdout + result.stderr
              assert result.returncode == expected, (args, output)
              assert "Traceback" not in output, (args, output)
              if "--help" in args:
                  assert "--ui web" not in output, output
          PY
