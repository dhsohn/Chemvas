name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      FACTORY_MACHINE_CONTRACT_VALIDATOR: ${{ github.workspace }}/.machine-contracts/scripts/validate.py
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check out machine observation contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dhsohn/machine-contracts
          ref: 38581a7737cd0521bb3d50b59115eefe3c9254ca
          path: .machine-contracts
          persist-credentials: false

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy

      - name: Run tests
        # The excluded modules gate on RDKit at module level, so in this
        # job (which installs no RDKit) they would run zero tests; the
        # rdkit-smoke job runs them instead. tests/test_ci_rdkit_coverage.py
        # pins the exclusions to those module-level gates in both directions.
        run: |
          mapfile -t files < <(find tests -name 'test_*.py' \
            ! -name 'test_calculation_bundle_rdkit.py' \
            ! -name 'test_calculation_step_rdkit.py' \
            ! -name 'test_catalyst_correspondence.py' \
            ! -name 'test_catalyst_mapping_workflows.py' \
            ! -name 'test_chemical_conversion_workflows.py' \
            ! -name 'test_rdkit_drawn_double_stereo.py' \
            ! -name 'test_rdkit_hypercoordinate_geometry.py' \
            ! -name 'test_rdkit_real_use.py' \
            ! -name 'test_rdkit_smiles_hydrogens.py' \
            | sort)
          bash scripts/run_test_files.sh --python python "${files[@]}"

  platform-tests:
    name: Common tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    permissions:
      contents: read
    env:
      # The gate otherwise builds its own .venv; here it runs on the
      # interpreter set up and provisioned by the steps below.
      PYTHON_BIN: python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check out machine observation contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dhsohn/machine-contracts
          ref: 38581a7737cd0521bb3d50b59115eefe3c9254ca
          path: .machine-contracts
          persist-credentials: false

      - name: Run the host platform gate
        shell: bash
        run: |
          FACTORY_MACHINE_CONTRACT_REPO="$PWD/.machine-contracts" bash scripts/check.sh

  windows-native:
    name: Windows native packaging tests
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      # Inno Setup 6 is included in the official windows-2025 image.
      # Fail if it disappears; a skipped native compiler test is not coverage.
      - name: Require native Inno Setup compiler
        shell: python
        run: |
          import os
          import struct
          import sys
          from pathlib import Path

          if sys.platform != "win32" or struct.calcsize("P") != 8:
              raise SystemExit("Windows x64 Python is required")
          compiler = Path(os.environ["ProgramFiles(x86)"]) / "Inno Setup 6" / "ISCC.exe"
          if not compiler.is_file():
              raise SystemExit(f"Required Inno Setup compiler is missing: {compiler}")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              path_file.write(str(compiler.parent) + "\n")
          print(f"Native compiler: {compiler}; Python: {sys.executable}")

      - name: Run Windows test files in separate processes
        shell: bash
        run: |
          python -c 'import runpy, sys; sys.exit(0 if runpy.run_path("tests/test_windows_installer.py")["ISCC"] else "Native compiler tests would be skipped")'
          bash scripts/run_test_files.sh --python python \
            tests/test_windows_bundle.py \
            tests/test_windows_installer.py \
            tests/test_application_cli.py

  rdkit-smoke:
    name: RDKit smoke tests
    runs-on: ubuntu-latest
    env:
      FACTORY_MACHINE_CONTRACT_VALIDATOR: ${{ github.workspace }}/.machine-contracts/scripts/validate.py
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install system packages for Qt
        # Real-RDKit canvas tests import QtGui/QtWidgets even when offscreen.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Install Python dependencies with RDKit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,rdkit]"

      - name: Check out machine observation contract
        # Real-RDKit pack-step tests validate their machine.json against the
        # same pinned contract as the main test job.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dhsohn/machine-contracts
          ref: 38581a7737cd0521bb3d50b59115eefe3c9254ca
          path: .machine-contracts
          persist-credentials: false

      - name: Verify RDKit import
        run: |
          python - <<'PY'
          from rdkit import Chem

          assert Chem.MolFromSmiles("CCO") is not None
          PY

      - name: Run the RDKit-gated test files
        # Runs through scripts/run_test_files.sh, the same runner the gate and
        # the main test job use, so "one pytest process per file" stays one
        # implementation. This is the only job that installs RDKit, so every
        # test file that gates tests on a real RDKit must be listed here or
        # those tests run in no CI job at all; tests/test_ci_rdkit_coverage.py
        # pins the list in both directions.
        run: |
          bash scripts/run_test_files.sh --python python \
            tests/test_annotation_default_placement.py \
            tests/test_bond_history_selection.py \
            tests/test_calculation_bundle_rdkit.py \
            tests/test_calculation_step_rdkit.py \
            tests/test_catalyst_correspondence.py \
            tests/test_catalyst_mapping_workflows.py \
            tests/test_chemical_conversion_workflows.py \
            tests/test_core_molfile.py \
            tests/test_core_rdkit_adapter.py \
            tests/test_editor_feedback_policy.py \
            tests/test_preview_reuse.py \
            tests/test_ui_design_workflows.py \
            tests/test_mark_ownership_semantics.py \
            tests/test_native_geometry_backlog.py \
            tests/test_rdkit_drawn_double_stereo.py \
            tests/test_rdkit_hypercoordinate_geometry.py \
            tests/test_rdkit_real_use.py \
            tests/test_rdkit_smiles_hydrogens.py

  package-smoke:
    name: Wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
          python scripts/verify_dist.py dist/*

      - name: Install wheel without source-tree imports
        run: |
          python -m venv /tmp/chemvas-wheel-smoke
          /tmp/chemvas-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/chemvas-wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import distribution
          from importlib.util import find_spec

          import chemvas
          import chemvas.ui
          from chemvas.bootstrap.application import main
          from chemvas.domain.document import MoleculeModel

          installed = distribution("chemvas")
          installed_files = {str(path) for path in installed.files or ()}
          console_scripts = {
              entry_point.name: entry_point.value
              for entry_point in installed.entry_points
              if entry_point.group == "console_scripts"
          }

          assert chemvas.__version__
          assert callable(main)
          assert MoleculeModel is not None
          assert "chemvas/adapters/qt/file_open_events.py" in installed_files
          assert console_scripts["chemvas"] == "chemvas.bootstrap.application:main"
          assert find_spec("core") is None
          assert find_spec("ui") is None
          PY
