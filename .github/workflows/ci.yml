name: CI

on:
  # Pull requests run through pull_request; a push runs only on main, so a PR
  # commit is checked once.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system packages for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy

      - name: Run tests
        id: tests
        run: |
          mapfile -t files < <(find tests -name 'test_*.py' | sort)
          bash scripts/run_test_files.sh --python python --coverage-dir htmlcov/ci "${files[@]}"

      - name: Report coverage
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: python scripts/report_coverage.py htmlcov/ci "Linux common suite / Python ${{ matrix.python-version }}" "${{ steps.tests.outcome == 'success' && '0' || '1' }}"

      - name: Upload coverage reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-common-${{ matrix.python-version }}
          path: htmlcov/ci/
          retention-days: 14

  package-smoke:
    name: Wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
          python scripts/verify_dist.py dist/*

      - name: Install wheel without source-tree imports
        run: |
          python -m venv /tmp/chemvas-wheel-smoke
          /tmp/chemvas-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/chemvas-wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import distribution
          from importlib.util import find_spec
          import subprocess
          import sys

          import chemvas
          import chemvas.ui
          from chemvas.bootstrap.application import main
          from chemvas.domain.document import MoleculeModel

          installed = distribution("chemvas")
          installed_files = {str(path) for path in installed.files or ()}
          console_scripts = {
              entry_point.name: entry_point.value
              for entry_point in installed.entry_points
              if entry_point.group == "console_scripts"
          }

          assert chemvas.__version__
          assert callable(main)
          assert MoleculeModel is not None
          assert "chemvas/adapters/qt/file_open_events.py" in installed_files
          assert console_scripts["chemvas"] == "chemvas.bootstrap.application:main"
          assert find_spec("core") is None
          assert find_spec("ui") is None
          assert find_spec("chemvas.bootstrap.web_adapter") is None
          assert find_spec("chemvas.bootstrap.web_drafts") is None
          assert not any(path.startswith("chemvas/web/") for path in installed_files)
          for args, expected in [
              (["--version"], 0),
              (["--help"], 0),
              (["--ui", "qt", "--help"], 0),
              (["--ui", "web"], 2),
              (["--ui", "web", "--no-browser"], 2),
          ]:
              result = subprocess.run(
                  [sys.executable, "-I", "-m", "chemvas", *args],
                  capture_output=True, text=True, timeout=15,
              )
              output = result.stdout + result.stderr
              assert result.returncode == expected, (args, output)
              assert "Traceback" not in output, (args, output)
              if "--help" in args:
                  assert "--ui web" not in output, output
          PY
