name: Optional Windows tests

# Explicit opt-in diagnostics; not a pull request or release gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    name: Windows native packaging tests
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      # Inno Setup 6 is included in the official windows-2025 image.
      # Fail if it disappears; a skipped native compiler test is not coverage.
      - name: Require native Inno Setup compiler
        shell: python
        run: |
          import os
          import struct
          import sys
          from pathlib import Path

          if sys.platform != "win32" or struct.calcsize("P") != 8:
              raise SystemExit("Windows x64 Python is required")
          compiler = Path(os.environ["ProgramFiles(x86)"]) / "Inno Setup 6" / "ISCC.exe"
          if not compiler.is_file():
              raise SystemExit(f"Required Inno Setup compiler is missing: {compiler}")
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as path_file:
              path_file.write(str(compiler.parent) + "\n")
          print(f"Native compiler: {compiler}; Python: {sys.executable}")

      - name: Run Windows test files in separate processes
        shell: bash
        run: |
          python -c 'import runpy, sys; sys.exit(0 if runpy.run_path("tests/test_windows_installer.py")["ISCC"] else "Native compiler tests would be skipped")'
          bash scripts/run_test_files.sh --python python \
            tests/test_windows_bundle.py \
            tests/test_windows_installer.py \
            tests/test_application_cli.py

      - name: Compare browser font sizes with the Windows font engine
        shell: bash
        env:
          QT_QPA_PLATFORM: windows
        run: python -m pytest -q tests/test_web_adapter.py -k browser_font_pixels_match_pinned_native_font

  platform-tests:
    name: Common tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    permissions:
      contents: read
    env:
      # The gate otherwise builds its own .venv; here it runs on the
      # interpreter set up and provisioned by the steps below.
      PYTHON_BIN: python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run the host platform gate
        shell: bash
        run: |
          bash scripts/check.sh
