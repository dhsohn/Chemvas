[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chemvas"
dynamic = ["version"]
description = "A lightweight PyQt6 app for drawing 2D chemical structures and reaction schemes."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "daehyupsohn" },
]
keywords = [
    "chemical drawing",
    "chemistry",
    "molecular editor",
    "PyQt6",
    "scientific software",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "Pillow>=10",
    "PyQt6>=6.7",
]

[project.optional-dependencies]
dev = [
    "coverage[toml]>=7",
    "jsonschema>=4.23,<5",
    "mypy>=2.3,<3",
    "pytest>=8",
    "ruff>=0.16.2,<0.17",
]
rdkit = [
    "rdkit>=2024.9",
]

[project.scripts]
chemvas = "chemvas.bootstrap.application:main"

[project.urls]
Homepage = "https://github.com/dhsohn/Chemvas"
Source = "https://github.com/dhsohn/Chemvas"
Issues = "https://github.com/dhsohn/Chemvas/issues"
Discussions = "https://github.com/dhsohn/Chemvas/discussions"
Changelog = "https://github.com/dhsohn/Chemvas/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "chemvas.__version__" }

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["app"]
include = ["chemvas*"]
namespaces = false

[tool.setuptools.package-data]
chemvas = ["assets/icon/*.svg", "assets/icon/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["app"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
# The import root is app/, not the repository root. Declaring it keeps
# first-party classification (and therefore I001 ordering) a property of this
# file rather than of ruff's directory inference.
src = ["app"]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C901",
    "E4",
    "E7",
    "E9",
    "F",
    "FURB",
    "G",
    "I",
    "ISC",
    "N",
    "PIE",
    "PLE",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "RSE",
    "RUF012",
    "RUF021",
    "RUF022",
    "RUF046",
    "RUF100",
    "TC",
    "TID",
    "UP",
]

# The four size limits are set to the largest value observed in the tree, so
# they forbid getting worse without demanding a rewrite of what exists. Lower
# them as the outliers shrink; never raise one to admit a new offender.
[tool.ruff.lint.mccabe]
max-complexity = 28

[tool.ruff.lint.pylint]
max-args = 20
max-branches = 28
max-statements = 100

[tool.ruff.lint.pep8-naming]
# Qt method names are camelCase, so an override must match them exactly, and
# RDKit's module bindings keep their upstream capitalization. Neither is a
# naming deviation this project can decide differently.
extend-ignore-names = [
    "*Event",
    "AllChem",
    "Chem",
    "assignId",
    "blockSignals",
    "boundingRect",
    "cleanIt",
    "drawBackground",
    "eventFilter",
    "maxIters",
    "scrollContentsBy",
    "setFont",
    "setPlainText",
]

[tool.ruff.lint.per-file-ignores]
# RUF012: test doubles use mutable class attributes as shared recording state.
# N802: test doubles reproduce Qt's camelCase method names so the code under
# test calls them exactly as it calls a real widget.
"tests/*.py" = ["E402", "N802", "RUF012"]

[tool.mypy]
python_version = "3.12"
mypy_path = "app"
files = ["app/chemvas"]
warn_unused_ignores = true
check_untyped_defs = true
# These four cost nothing to hold everywhere: the legacy ``chemvas.core`` and
# ``chemvas.ui`` packages already satisfy them. Keeping them project-wide means
# a new package inherits them instead of waiting to be listed below.
disallow_subclassing_any = true
extra_checks = true
implicit_reexport = false
strict_equality = true

[[tool.mypy.overrides]]
module = ["rdkit", "rdkit.*"]
ignore_missing_imports = true

# New architectural owners are held to mypy's full strict profile. Legacy
# ``chemvas.core`` / ``chemvas.ui`` modules remain on the project-wide gradual
# settings until their feature slice moves behind one of these public APIs.
[[tool.mypy.overrides]]
module = [
    "chemvas.domain.*",
    "chemvas.features.*",
    "chemvas.shell.*",
    "chemvas.adapters.*",
    "chemvas.bootstrap.*",
    # These five legacy modules are promoted individually because filling in
    # their signatures was enough to satisfy strict; the rest of
    # ``chemvas.core`` / ``chemvas.ui`` still needs body work first.
    "chemvas.core.tool_overlay_logic",
    "chemvas.core.bond_tool_logic",
    "chemvas.core.text_tool_logic",
    "chemvas.ui.transactions.document",
    "chemvas.ui.transactions.object_graph_snapshot",
]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true

# chemvas.core.rdkit_adapter carries a type: ignore for rdkit-stubs' missing
# RDLogger.DisableLog. Without rdkit installed (CI) the module is Any and the
# ignore would be flagged as unused, so skip that warning for this module only.
[[tool.mypy.overrides]]
module = ["chemvas.core.rdkit_adapter"]
warn_unused_ignores = false
